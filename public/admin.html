<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>INSTASave Admin</title>
<style>body{font-family:Arial;background:#f6f7fb;margin:0;padding:30px}.wrap{max-width:1000px;margin:auto}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;padding:25px;border-radius:15px;border:1px solid #e5e7eb}.n{font-size:35px;font-weight:800;margin-top:10px}input,button{padding:12px;border-radius:8px;border:1px solid #ddd}button{background:#111827;color:#fff;cursor:pointer}@media(max-width:650px){.cards{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>INSTASave Admin</h1><p>Enter your ADMIN_KEY to view live statistics.</p><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="load()">View Stats</button><div class="cards" style="margin-top:25px"><div class="card">Requests<div class="n" id="r">—</div></div><div class="card">Downloads<div class="n" id="d">—</div></div><div class="card">Errors<div class="n" id="e">—</div></div></div><p id="msg"></p></div>
<script>async function load(){const k=document.getElementById('key').value;const r=await fetch('/admin/api/stats',{headers:{'x-admin-key':k}});const d=await r.json();if(!r.ok){document.getElementById('msg').textContent=d.error;return}document.getElementById('r').textContent=d.requests;document.getElementById('d').textContent=d.downloads;document.getElementById('e').textContent=d.errors;document.getElementById('msg').textContent='Updated '+new Date().toLocaleString()}</script></body></html>
